name: Deploy Shiny App to shinyapps.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # Check out repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Set up current R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'

      # Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libjpeg-dev \
            libtiff-dev \
            libpng-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev

      # Install required R packages
      - name: Install R packages
        run: |
          Rscript -e "install.packages('shiny', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('DT', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('leaflet', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('ggplot2', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('dplyr', repos='https://cloud.r-project.org')"
          Rscript -e "install.packages('rsconnect', repos='https://cloud.r-project.org')"

      # Verify required packages
      - name: Verify R packages
        run: |
          Rscript -e "library(shiny); cat('Shiny:', as.character(packageVersion('shiny')), '\n')"
          Rscript -e "library(DT); cat('DT:', as.character(packageVersion('DT')), '\n')"
          Rscript -e "library(leaflet); cat('leaflet:', as.character(packageVersion('leaflet')), '\n')"
          Rscript -e "library(ggplot2); cat('ggplot2:', as.character(packageVersion('ggplot2')), '\n')"
          Rscript -e "library(dplyr); cat('dplyr:', as.character(packageVersion('dplyr')), '\n')"
          Rscript -e "library(rsconnect); cat('rsconnect:', as.character(packageVersion('rsconnect')), '\n')"

      # Deploy to shinyapps.io
      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "rsconnect::setAccountInfo(name=Sys.getenv('SHINYAPPS_NAME'), token=Sys.getenv('SHINYAPPS_TOKEN'), secret=Sys.getenv('SHINYAPPS_SECRET'))"
          Rscript -e "rsconnect::deployApp(appDir='.', appName='14C-App', forceUpdate=TRUE)"


