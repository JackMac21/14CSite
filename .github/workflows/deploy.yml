name: Deploy Shiny App to shinyapps.io

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.1'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libpng-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libjpeg-dev \
            libtiff5-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev
            
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
              shiny
              DT
              leaflet
              ggplot2
              dplyr
              rsconnect
                
      - name: Check Shiny installation
        run: |
          Rscript -e "library(shiny); packageVersion('shiny')"
          Rscript -e "library(DT); packageVersion('DT')"
          Rscript -e "library(leaflet); packageVersion('leaflet')"
          Rscript -e "library(ggplot2); packageVersion('ggplot2')"
          Rscript -e "library(dplyr); packageVersion('dplyr')"
          Rscript -e "library(rsconnect); packageVersion('rsconnect')"


      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          Rscript -e "rsconnect::setAccountInfo(name=Sys.getenv('SHINYAPPS_NAME'), token=Sys.getenv('SHINYAPPS_TOKEN'), secret=Sys.getenv('SHINYAPPS_SECRET'))"
          Rscript -e "rsconnect::deployApp(appDir='.', appName='14C-App', forceUpdate = TRUE)"



